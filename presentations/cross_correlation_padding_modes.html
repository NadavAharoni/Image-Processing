
<style>
  .btn { cursor:pointer; padding:5px 14px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-primary); font-size:12px; }
  .btn:hover { background:var(--color-background-secondary); }
  .btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
  .ctrl-row { display:flex; align-items:center; gap:8px; margin:8px 0 4px; flex-wrap:wrap; justify-content:center; }
</style>

<h2 class="sr-only">Interactive visualization of cross-correlation padding modes: valid, zero, reflect, and replicate, showing how the kernel handles image borders.</h2>

<svg id="svg" width="100%" viewBox="0 0 680 430" role="img">
  <title>Cross-correlation padding modes</title>
  <desc>Shows a 4x4 image surrounded by a padding border, with a 3x3 kernel sliding over it. The padding cells change color and value depending on the selected padding mode.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text id="hdr-padded" font-size="12" x="188" y="22" text-anchor="middle" fill="var(--color-text-secondary)">Padded image (6×6)</text>
  <text font-size="12" x="468" y="22" text-anchor="middle" fill="var(--color-text-secondary)">Kernel (3×3)</text>
  <text font-size="12" x="610" y="22" text-anchor="middle" fill="var(--color-text-secondary)">Output (4×4)</text>

  <!-- grids injected by JS -->
  <g id="padded-grid"></g>
  <g id="kernel-grid"></g>
  <g id="output-grid"></g>

  <!-- kernel window overlay -->
  <rect id="kwin" x="60" y="33" width="114" height="114" rx="3"
        fill="none" stroke="#378ADD" stroke-width="2" opacity="0.9"/>

  <!-- info text -->
  <text id="pos-label"  font-size="12" x="340" y="310" text-anchor="middle" fill="var(--color-text-secondary)"></text>
  <text id="pad-desc"   font-size="12" x="340" y="330" text-anchor="middle" fill="var(--color-text-secondary)"></text>
  <text id="comp-result" font-size="12" x="340" y="352" text-anchor="middle" fill="var(--color-text-info)"></text>

  <!-- legend -->
  <rect x="60"  y="375" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-size="11" x="79" y="386" fill="var(--color-text-secondary)">original pixel</text>
  <rect x="175" y="375" width="14" height="14" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text font-size="11" x="194" y="386" fill="var(--color-text-secondary)">padding cell</text>
  <rect x="285" y="375" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text font-size="11" x="304" y="386" fill="var(--color-text-secondary)">kernel window</text>
  <rect x="400" y="375" width="14" height="14" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-size="11" x="419" y="386" fill="var(--color-text-secondary)">output (current)</text>
  <rect x="510" y="375" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-size="11" x="529" y="386" fill="var(--color-text-secondary)">output (done)</text>

  <text font-size="11" x="340" y="415" text-anchor="middle" fill="var(--color-text-tertiary)">
    same mode: output is same size as input (4×4). Padding fills the border so every pixel gets a full kernel window.
  </text>
</svg>

<div class="ctrl-row">
  <span style="font-size:12px;color:var(--color-text-secondary)">Mode:</span>
  <button class="btn" id="btn-valid"     onclick="setMode('valid')">valid (2×2)</button>
  <button class="btn active" id="btn-zero" onclick="setMode('zero')">zero pad</button>
  <button class="btn" id="btn-reflect"   onclick="setMode('reflect')">reflect</button>
  <button class="btn" id="btn-replicate" onclick="setMode('replicate')">replicate</button>
</div>
<div class="ctrl-row" style="margin-top:4px;">
  <button class="btn" id="btn-prev" onclick="step(-1)">← prev</button>
  <button class="btn active" id="btn-play" onclick="togglePlay()">▶ play</button>
  <button class="btn" id="btn-next" onclick="step(1)">next →</button>
  <span style="font-size:12px;color:var(--color-text-secondary);margin-left:6px;">Step <span id="step-lbl">1</span> / <span id="step-tot">4</span></span>
</div>

<script>
const image = [
  [103,102,101,100],
  [104,103,102,101],
  [ 53, 52, 51, 50],
  [ 45, 53, 52, 51]
];
const kernel = [
  [-1, 2, 1],
  [-2, 1,-3],
  [ 3, 0,-1]
];

const NS = 'http://www.w3.org/2000/svg';
const CELL = 38;
const KX = 380, KY = 33;
const OX = 556, OY = 33, OCELL = 34;

let mode = 'zero';
let cur = 0;
let playing = false, timer = null;

function getPaddedSize() { return mode === 'valid' ? 4 : 6; }
function getOutputSize() { return mode === 'valid' ? 2 : 4; }

function getPadded(mode) {
  if (mode === 'valid') return image.map(r=>[...r]);
  const P = 6;
  const pad = Array.from({length:P}, ()=>Array(P).fill(0));
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) pad[r+1][c+1] = image[r][c];
  if (mode === 'zero') {
    // already 0
  } else if (mode === 'reflect') {
    for (let r=0;r<4;r++) {
      pad[r+1][0] = image[r][1];
      pad[r+1][5] = image[r][2];
    }
    for (let c=0;c<4;c++) {
      pad[0][c+1] = image[1][c];
      pad[5][c+1] = image[2][c];
    }
    pad[0][0]=image[1][1]; pad[0][5]=image[1][2];
    pad[5][0]=image[2][1]; pad[5][5]=image[2][2];
  } else if (mode === 'replicate') {
    for (let r=0;r<4;r++) {
      pad[r+1][0] = image[r][0];
      pad[r+1][5] = image[r][3];
    }
    for (let c=0;c<4;c++) {
      pad[0][c+1] = image[0][c];
      pad[5][c+1] = image[3][c];
    }
    pad[0][0]=image[0][0]; pad[0][5]=image[0][3];
    pad[5][0]=image[3][0]; pad[5][5]=image[3][3];
  }
  return pad;
}

function isPadCell(r,c,mode) {
  if (mode==='valid') return false;
  return r===0||r===5||c===0||c===5;
}

function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if(parent) parent.appendChild(e);
  return e;
}
function txt(content,attrs,parent){
  const e=el('text',attrs,parent);
  e.textContent=content; return e;
}

function buildGrids() {
  const pSize = getPaddedSize();
  const oSize = getOutputSize();
  const padded = getPadded(mode);
  const GX = mode==='valid' ? 60+19 : 60;
  const GY = 33;
  const headerEl = document.getElementById('hdr-padded');
  headerEl.textContent = mode==='valid' ? 'Image (4×4) — no padding' : `Padded image (6×6)`;
  headerEl.setAttribute('x', GX + pSize*CELL/2);

  document.getElementById('padded-grid').innerHTML='';
  document.getElementById('kernel-grid').innerHTML='';
  document.getElementById('output-grid').innerHTML='';

  const pg = document.getElementById('padded-grid');
  for (let r=0;r<pSize;r++) for (let c=0;c<pSize;c++) {
    const isPad = isPadCell(r,c,mode);
    const g=el('g',{},pg);
    g.dataset.r=r; g.dataset.c=c;
    el('rect',{x:GX+c*CELL,y:GY+r*CELL,width:CELL,height:CELL,rx:2,
      fill: isPad?'#FAEEDA':'#E6F1FB',
      stroke: isPad?'#854F0B':'#185FA5',
      'stroke-width':'0.5'},g);
    const val = padded[r][c];
    txt(val,{x:GX+c*CELL+CELL/2,y:GY+r*CELL+CELL/2,
      'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'10',
      fill: isPad?'#633806':'#0C447C'},g);
    g.dataset.pad = isPad?'1':'0';
  }

  const kg = document.getElementById('kernel-grid');
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const g=el('g',{},kg);
    el('rect',{x:KX+c*CELL,y:KY+r*CELL,width:CELL,height:CELL,rx:2,
      fill:'#FAEEDA',stroke:'#854F0B','stroke-width':'0.5'},g);
    txt(kernel[r][c],{x:KX+c*CELL+CELL/2,y:KY+r*CELL+CELL/2,
      'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'11',fill:'#633806'},g);
  }

  const og = document.getElementById('output-grid');
  window._outRects=[];
  for (let r=0;r<oSize;r++) for (let c=0;c<oSize;c++) {
    const g=el('g',{},og);
    const rect=el('rect',{x:OX+c*OCELL,y:OY+r*OCELL,width:OCELL,height:OCELL,rx:3,
      fill:'#F1EFE8',stroke:'#5F5E5A','stroke-width':'0.5'},g);
    const t=txt('?',{x:OX+c*OCELL+OCELL/2,y:OY+r*OCELL+OCELL/2,
      'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'10',fill:'var(--color-text-tertiary)'},g);
    window._outRects.push({rect,t,r,c});
  }

  document.getElementById('step-tot').textContent = oSize*oSize;
}

function computeResult(i,j) {
  const padded = getPadded(mode);
  const pOff = mode==='valid'?0:1;
  let s=0;
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    s += padded[i+r][j+c] * kernel[r][c];
  }
  return Math.round(s);
}

function render(pos) {
  const oSize = getOutputSize();
  const pSize = getPaddedSize();
  const total = oSize*oSize;
  const oi = Math.floor(pos/oSize);
  const oj = pos%oSize;
  const GX = mode==='valid'?60+19:60;
  const GY = 33;
  const pOff = mode==='valid'?0:0;

  document.getElementById('kwin').setAttribute('x', GX+oj*CELL);
  document.getElementById('kwin').setAttribute('y', GY+oi*CELL);
  document.getElementById('kwin').setAttribute('width', 3*CELL);
  document.getElementById('kwin').setAttribute('height', 3*CELL);

  const cells = document.getElementById('padded-grid').querySelectorAll('g');
  cells.forEach(g=>{
    const r=+g.dataset.r, c=+g.dataset.c;
    const isPad=g.dataset.pad==='1';
    const inPatch=r>=oi&&r<oi+3&&c>=oj&&c<oj+3;
    const rect=g.querySelector('rect');
    const t=g.querySelector('text');
    if (inPatch) {
      rect.setAttribute('fill', isPad?'#EF9F27':'#378ADD');
      rect.setAttribute('stroke', isPad?'#633806':'#0C447C');
      rect.setAttribute('opacity','1');
      t.setAttribute('fill','#fff');
    } else {
      rect.setAttribute('fill', isPad?'#FAEEDA':'#E6F1FB');
      rect.setAttribute('stroke', isPad?'#854F0B':'#185FA5');
      rect.setAttribute('opacity','0.85');
      t.setAttribute('fill', isPad?'#633806':'#0C447C');
    }
  });

  const imgI = mode==='valid'?oi:oi;
  const imgJ = mode==='valid'?oj:oj;
  const pLabel = mode==='valid'
    ? `Position (i=${oi}, j=${oj})  —  valid: kernel fully inside image`
    : `Position (i=${oi}, j=${oj})  —  kernel window includes ${countPadInWindow(oi,oj)} padding cell(s)`;
  document.getElementById('pos-label').textContent = pLabel;

  const desc = {
    valid:     'valid: kernel only slides where it fits entirely inside the image',
    zero:      'zero pad: border filled with 0s  →  same output size as input',
    reflect:   'reflect: border mirrors the nearest pixels inward',
    replicate: 'replicate: border repeats the nearest edge pixel'
  };
  document.getElementById('pad-desc').textContent = desc[mode];

  const result = computeResult(oi, oj);
  document.getElementById('comp-result').textContent = `result[${oi},${oj}] = ${result}`;

  const ors = window._outRects;
  for (let p=0;p<ors.length;p++) {
    const {rect,t} = ors[p];
    const pi=Math.floor(p/oSize), pj=p%oSize;
    if (p<pos) {
      rect.setAttribute('fill','#F1EFE8');
      rect.setAttribute('stroke','#5F5E5A');
      t.setAttribute('fill','var(--color-text-secondary)');
      t.textContent=computeResult(pi,pj);
    } else if (p===pos) {
      rect.setAttribute('fill','#EAF3DE');
      rect.setAttribute('stroke','#3B6D11');
      t.setAttribute('fill','#27500A');
      t.textContent=result;
    } else {
      rect.setAttribute('fill','#F1EFE8');
      rect.setAttribute('stroke','#5F5E5A');
      t.setAttribute('fill','var(--color-text-tertiary)');
      t.textContent='?';
    }
  }

  document.getElementById('step-lbl').textContent = pos+1;
}

function countPadInWindow(oi,oj) {
  if (mode==='valid') return 0;
  let n=0;
  for (let r=oi;r<oi+3;r++) for (let c=oj;c<oj+3;c++) {
    if (r===0||r===5||c===0||c===5) n++;
  }
  return n;
}

function setMode(m) {
  mode=m; cur=0;
  ['valid','zero','reflect','replicate'].forEach(x=>{
    document.getElementById('btn-'+x).classList.toggle('active',x===m);
  });
  buildGrids();
  render(0);
}

function step(d) {
  const total = getOutputSize()*getOutputSize();
  cur=(cur+d+total)%total;
  render(cur);
}

function togglePlay() {
  playing=!playing;
  document.getElementById('btn-play').textContent=playing?'⏸ pause':'▶ play';
  if(playing) tick(); else clearTimeout(timer);
}

function tick() {
  if(!playing) return;
  const total=getOutputSize()*getOutputSize();
  cur=(cur+1)%total;
  render(cur);
  timer=setTimeout(tick,1400);
}

buildGrids();
render(0);
</script>
