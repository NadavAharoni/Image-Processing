
<style>
  .btn { cursor:pointer; padding:5px 14px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-primary); font-size:12px; }
  .btn:hover { background:var(--color-background-secondary); }
  .btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
  .ctrl-row { display:flex; align-items:center; gap:8px; margin:6px 0 4px; flex-wrap:wrap; justify-content:center; }
</style>

<h2 class="sr-only">Interactive visualization of cross-correlation padding modes: valid, zero, reflect, and replicate, showing how the kernel handles image borders.</h2>

<svg id="svg" width="100%" viewBox="0 0 680 420" role="img">
  <title>Cross-correlation padding modes</title>
  <desc>A padded image grid with a sliding 3x3 kernel, showing valid, zero, reflect, and replicate padding modes and a same-size output grid.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CELL=36, image at x=20, kernel at x=300, output at x=530 -->

  <text id="hdr-padded" font-size="11" x="154" y="20" text-anchor="middle" fill="var(--color-text-secondary)">Padded image (6×6)</text>
  <text font-size="11" x="390" y="20" text-anchor="middle" fill="var(--color-text-secondary)">Kernel (3×3)</text>
  <text font-size="11" x="594" y="20" text-anchor="middle" fill="var(--color-text-secondary)">Output (4×4)</text>

  <g id="padded-grid"></g>
  <g id="kernel-grid"></g>
  <g id="output-grid"></g>

  <rect id="kwin" x="20" y="28" width="108" height="108" rx="3"
        fill="none" stroke="#378ADD" stroke-width="2" opacity="0.9"/>

  <text id="pos-label"   font-size="11" x="340" y="300" text-anchor="middle" fill="var(--color-text-secondary)"></text>
  <text id="pad-desc"    font-size="11" x="340" y="318" text-anchor="middle" fill="var(--color-text-secondary)"></text>
  <text id="comp-result" font-size="11" x="340" y="338" text-anchor="middle" fill="var(--color-text-info)"></text>

  <!-- legend row 1 -->
  <rect x="20"  y="358" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-size="10" x="36" y="369" fill="var(--color-text-secondary)">original pixel</text>
  <rect x="140" y="358" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text font-size="10" x="156" y="369" fill="var(--color-text-secondary)">padding cell</text>
  <rect x="255" y="358" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text font-size="10" x="271" y="369" fill="var(--color-text-secondary)">kernel window</text>
  <rect x="380" y="358" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-size="10" x="396" y="369" fill="var(--color-text-secondary)">output (current)</text>
  <rect x="510" y="358" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-size="10" x="526" y="369" fill="var(--color-text-secondary)">output (done)</text>

  <text font-size="10" x="340" y="395" text-anchor="middle" fill="var(--color-text-tertiary)">same mode: output same size as input (4×4) — padding gives every pixel a full kernel window</text>
  <text font-size="10" x="340" y="410" text-anchor="middle" fill="var(--color-text-tertiary)">valid mode: no padding — kernel only fits where it's fully inside the image → smaller output (2×2)</text>
</svg>

<div class="ctrl-row">
  <span style="font-size:12px;color:var(--color-text-secondary)">Mode:</span>
  <button class="btn" id="btn-valid"     onclick="setMode('valid')">valid (2×2)</button>
  <button class="btn active" id="btn-zero" onclick="setMode('zero')">zero pad</button>
  <button class="btn" id="btn-reflect"   onclick="setMode('reflect')">reflect</button>
  <button class="btn" id="btn-replicate" onclick="setMode('replicate')">replicate</button>
</div>
<div class="ctrl-row" style="margin-top:2px;">
  <button class="btn" id="btn-prev" onclick="step(-1)">← prev</button>
  <button class="btn active" id="btn-play" onclick="togglePlay()">▶ play</button>
  <button class="btn" id="btn-next" onclick="step(1)">next →</button>
  <span style="font-size:12px;color:var(--color-text-secondary);margin-left:6px;">Step <span id="step-lbl">1</span> / <span id="step-tot">4</span></span>
</div>

<script>
const image = [
  [103,102,101,100],
  [104,103,102,101],
  [ 53, 52, 51, 50],
  [ 45, 53, 52, 51]
];
const kernel = [[-1,2,1],[-2,1,-3],[3,0,-1]];

const NS = 'http://www.w3.org/2000/svg';
const CELL = 36;
const GX0 = 20, GY = 28;       // padded grid origin (valid: offset by 1 cell)
const KX = 300, KY = 28;        // kernel grid
const OX = 530, OY = 28;        // output grid
const OCELL = 36;

let mode = 'zero', cur = 0, playing = false, timer = null;

function getOutputSize() { return mode==='valid' ? 2 : 4; }

function getPadded(m) {
  if (m==='valid') return image.map(r=>[...r]);
  const pad = Array.from({length:6},()=>Array(6).fill(0));
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) pad[r+1][c+1]=image[r][c];
  if (m==='reflect') {
    for (let r=0;r<4;r++) { pad[r+1][0]=image[r][1]; pad[r+1][5]=image[r][2]; }
    for (let c=0;c<4;c++) { pad[0][c+1]=image[1][c]; pad[5][c+1]=image[2][c]; }
    pad[0][0]=image[1][1]; pad[0][5]=image[1][2]; pad[5][0]=image[2][1]; pad[5][5]=image[2][2];
  } else if (m==='replicate') {
    for (let r=0;r<4;r++) { pad[r+1][0]=image[r][0]; pad[r+1][5]=image[r][3]; }
    for (let c=0;c<4;c++) { pad[0][c+1]=image[0][c]; pad[5][c+1]=image[3][c]; }
    pad[0][0]=image[0][0]; pad[0][5]=image[0][3]; pad[5][0]=image[3][0]; pad[5][5]=image[3][3];
  }
  return pad;
}

function isPad(r,c,m) { return m!=='valid' && (r===0||r===5||c===0||c===5); }

function el(tag,attrs,parent) {
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if(parent) parent.appendChild(e);
  return e;
}
function txt(content,attrs,parent) {
  const e=el('text',attrs,parent); e.textContent=content; return e;
}

function buildGrids() {
  const pSize = mode==='valid' ? 4 : 6;
  const oSize = getOutputSize();
  const padded = getPadded(mode);
  const GX = mode==='valid' ? GX0+CELL : GX0;  // center valid grid

  const hdr = document.getElementById('hdr-padded');
  hdr.textContent = mode==='valid' ? 'Image (4×4) — no padding' : 'Padded image (6×6)';
  hdr.setAttribute('x', GX + pSize*CELL/2);

  document.getElementById('padded-grid').innerHTML='';
  document.getElementById('kernel-grid').innerHTML='';
  document.getElementById('output-grid').innerHTML='';

  const pg = document.getElementById('padded-grid');
  for (let r=0;r<pSize;r++) for (let c=0;c<pSize;c++) {
    const ip = isPad(r,c,mode);
    const g=el('g',{},pg);
    g.dataset.r=r; g.dataset.c=c; g.dataset.pad=ip?'1':'0';
    el('rect',{x:GX+c*CELL,y:GY+r*CELL,width:CELL,height:CELL,rx:2,
      fill:ip?'#FAEEDA':'#E6F1FB', stroke:ip?'#854F0B':'#185FA5','stroke-width':'0.5'},g);
    txt(padded[r][c],{x:GX+c*CELL+CELL/2,y:GY+r*CELL+CELL/2,
      'text-anchor':'middle','dominant-baseline':'central','font-size':'10',
      fill:ip?'#633806':'#0C447C'},g);
  }

  const kg=document.getElementById('kernel-grid');
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const g=el('g',{},kg);
    el('rect',{x:KX+c*CELL,y:KY+r*CELL,width:CELL,height:CELL,rx:2,
      fill:'#FAEEDA',stroke:'#854F0B','stroke-width':'0.5'},g);
    txt(kernel[r][c],{x:KX+c*CELL+CELL/2,y:KY+r*CELL+CELL/2,
      'text-anchor':'middle','dominant-baseline':'central','font-size':'11',fill:'#633806'},g);
  }

  const og=document.getElementById('output-grid');
  window._outRects=[];
  for (let r=0;r<oSize;r++) for (let c=0;c<oSize;c++) {
    const g=el('g',{},og);
    const rect=el('rect',{x:OX+c*OCELL,y:OY+r*OCELL,width:OCELL,height:OCELL,rx:3,
      fill:'#F1EFE8',stroke:'#5F5E5A','stroke-width':'0.5'},g);
    const t=txt('?',{x:OX+c*OCELL+OCELL/2,y:OY+r*OCELL+OCELL/2,
      'text-anchor':'middle','dominant-baseline':'central','font-size':'10',
      fill:'var(--color-text-tertiary)'},g);
    window._outRects.push({rect,t,r,c});
  }

  document.getElementById('step-tot').textContent = oSize*oSize;
}

function computeAt(oi,oj) {
  const padded=getPadded(mode);
  let s=0;
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) s+=padded[oi+r][oj+c]*kernel[r][c];
  return Math.round(s);
}

function countPadInWindow(oi,oj) {
  let n=0;
  for (let r=oi;r<oi+3;r++) for (let c=oj;c<oj+3;c++) if(isPad(r,c,mode)) n++;
  return n;
}

function render(pos) {
  const oSize=getOutputSize();
  const pSize=mode==='valid'?4:6;
  const GX=mode==='valid'?GX0+CELL:GX0;
  const oi=Math.floor(pos/oSize), oj=pos%oSize;

  document.getElementById('kwin').setAttribute('x', GX+oj*CELL);
  document.getElementById('kwin').setAttribute('y', GY+oi*CELL);
  document.getElementById('kwin').setAttribute('width', 3*CELL);
  document.getElementById('kwin').setAttribute('height', 3*CELL);

  document.getElementById('padded-grid').querySelectorAll('g').forEach(g=>{
    const r=+g.dataset.r, c=+g.dataset.c, ip=g.dataset.pad==='1';
    const inP=r>=oi&&r<oi+3&&c>=oj&&c<oj+3;
    const rect=g.querySelector('rect'), t=g.querySelector('text');
    if (inP) {
      rect.setAttribute('fill',ip?'#EF9F27':'#378ADD');
      rect.setAttribute('stroke',ip?'#633806':'#0C447C');
      t.setAttribute('fill','#fff');
    } else {
      rect.setAttribute('fill',ip?'#FAEEDA':'#E6F1FB');
      rect.setAttribute('stroke',ip?'#854F0B':'#185FA5');
      t.setAttribute('fill',ip?'#633806':'#0C447C');
    }
  });

  const nPad = mode==='valid' ? 0 : countPadInWindow(oi,oj);
  document.getElementById('pos-label').textContent = mode==='valid'
    ? `Position (i=${oi}, j=${oj})  —  kernel fully inside image`
    : `Position (i=${oi}, j=${oj})  —  kernel window includes ${nPad} padding cell(s)`;

  const descs = {
    valid:     'valid: kernel only slides where it fits entirely inside the image',
    zero:      'zero pad: border filled with 0s  →  same output size as input',
    reflect:   'reflect: border mirrors nearest pixels inward',
    replicate: 'replicate: border repeats the nearest edge pixel'
  };
  document.getElementById('pad-desc').textContent = descs[mode];
  document.getElementById('comp-result').textContent = `result[${oi},${oj}] = ${computeAt(oi,oj)}`;

  window._outRects.forEach((o,p)=>{
    const pi=Math.floor(p/oSize), pj=p%oSize;
    if (p<pos) {
      o.rect.setAttribute('fill','#F1EFE8'); o.rect.setAttribute('stroke','#5F5E5A');
      o.t.setAttribute('fill','var(--color-text-secondary)'); o.t.textContent=computeAt(pi,pj);
    } else if (p===pos) {
      o.rect.setAttribute('fill','#EAF3DE'); o.rect.setAttribute('stroke','#3B6D11');
      o.t.setAttribute('fill','#27500A'); o.t.textContent=computeAt(oi,oj);
    } else {
      o.rect.setAttribute('fill','#F1EFE8'); o.rect.setAttribute('stroke','#5F5E5A');
      o.t.setAttribute('fill','var(--color-text-tertiary)'); o.t.textContent='?';
    }
  });

  document.getElementById('step-lbl').textContent = pos+1;
}

function setMode(m) {
  mode=m; cur=0;
  ['valid','zero','reflect','replicate'].forEach(x=>
    document.getElementById('btn-'+x).classList.toggle('active',x===m));
  buildGrids(); render(0);
}

function step(d) {
  const total=getOutputSize()*getOutputSize();
  cur=(cur+d+total)%total; render(cur);
}

function togglePlay() {
  playing=!playing;
  document.getElementById('btn-play').textContent=playing?'⏸ pause':'▶ play';
  if(playing) tick(); else clearTimeout(timer);
}

function tick() {
  if(!playing) return;
  const total=getOutputSize()*getOutputSize();
  cur=(cur+1)%total; render(cur);
  timer=setTimeout(tick,1400);
}

buildGrids(); render(0);
</script>
