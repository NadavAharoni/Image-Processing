
<style>
  :root { --speed: 1s; }
  .btn { cursor:pointer; padding:6px 16px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-primary); font-size:13px; }
  .btn:hover { background:var(--color-background-secondary); }
  .btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
</style>

<svg id="svg" width="100%" viewBox="0 0 680 420" role="img">
  <title>Cross-correlation sliding window animation</title>
  <desc>A 4x4 image with a 3x3 kernel sliding across it, showing each position and the resulting 2x2 output</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text class="ts" x="148" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Image (4×4)</text>
  <text class="ts" x="370" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Kernel (3×3)</text>
  <text class="ts" x="560" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Output (2×2)</text>

  <!-- IMAGE GRID 4x4 at x=60, y=44, cell=44px -->
  <g id="image-grid">
    <!-- cells -->
    <g id="img-cells"></g>
    <!-- overlay: kernel highlight -->
    <rect id="kwin" x="60" y="44" width="132" height="132" rx="4"
          fill="none" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- KERNEL GRID 3x3 at x=280, y=44, cell=44px -->
  <g id="kernel-grid"></g>

  <!-- multiply sign -->
  <text class="th" x="252" y="118" text-anchor="middle" fill="var(--color-text-secondary)">×</text>

  <!-- Arrow to output -->
  <line x1="458" y1="152" x2="506" y2="152" class="arr" stroke="var(--color-border-secondary)" marker-end="url(#arrow)"/>

  <!-- OUTPUT GRID 2x2 at x=510, y=100, cell=60px -->
  <g id="output-grid"></g>

  <!-- position indicator -->
  <text id="pos-label" class="ts" x="340" y="240" text-anchor="middle" fill="var(--color-text-secondary)">Position (i=0, j=0)</text>

  <!-- computation row -->
  <g id="comp-area">
    <text id="comp-text" class="ts" x="340" y="270" text-anchor="middle" fill="var(--color-text-secondary)"></text>
    <text id="comp-result" class="ts" x="340" y="292" text-anchor="middle" fill="var(--color-text-info)"></text>
  </g>

  <!-- equation explanation -->
  <text class="ts" x="340" y="340" text-anchor="middle" fill="var(--color-text-tertiary)">result[i,j] = Σ (patch × kernel)  —  no division, raw sum of products</text>
</svg>

<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px;">
  <button class="btn" id="btn-prev" onclick="step(-1)">← prev</button>
  <button class="btn active" id="btn-play" onclick="togglePlay()">▶ play</button>
  <button class="btn" id="btn-next" onclick="step(1)">next →</button>
  <span style="font-size:13px;color:var(--color-text-secondary);margin-left:8px;">Step <span id="step-lbl">1</span> / 4</span>
</div>

<script>
const image = [
  [103,102,101,100],
  [104,103,102,101],
  [ 53, 52, 51, 50],
  [ 45, 53, 52, 51]
];
const kernel = [
  [-1, 2, 1],
  [-2, 1,-3],
  [ 3, 0,-1]
];

const positions = [{i:0,j:0},{i:0,j:1},{i:1,j:0},{i:1,j:1}];
let cur = 0, playing = false, timer = null;

const CELL = 44, OCELL = 60;
const IX=60, IY=44, KX=280, KY=44, OX=510, OY=95;

const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(content, attrs, parent) {
  const e = el('text', attrs, parent);
  e.textContent = content;
  return e;
}

// build image grid
const imgCells = document.getElementById('img-cells');
for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
  const g = el('g',{},imgCells);
  el('rect',{x:IX+c*CELL, y:IY+r*CELL, width:CELL, height:CELL, rx:2,
    fill:'var(--color-background-secondary)', stroke:'var(--color-border-tertiary)', 'stroke-width':'0.5'},g);
  txt(image[r][c], {x:IX+c*CELL+CELL/2, y:IY+r*CELL+CELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-primary)'},g);
  g.dataset.r = r; g.dataset.c = c;
}

// build kernel grid
const kg = document.getElementById('kernel-grid');
for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
  const g = el('g',{},kg);
  el('rect',{x:KX+c*CELL, y:KY+r*CELL, width:CELL, height:CELL, rx:2,
    fill:'var(--color-background-info)', stroke:'var(--color-border-info)', 'stroke-width':'0.5', opacity:'0.35'},g);
  txt(kernel[r][c], {x:KX+c*CELL+CELL/2, y:KY+r*CELL+CELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-info)'},g);
}

// build output grid
const og = document.getElementById('output-grid');
const outRects = [], outTexts = [];
for (let r=0;r<2;r++) for (let c=0;c<2;c++) {
  const g = el('g',{},og);
  const rect = el('rect',{x:OX+c*OCELL, y:OY+r*OCELL, width:OCELL, height:OCELL, rx:4,
    fill:'var(--color-background-secondary)', stroke:'var(--color-border-tertiary)', 'stroke-width':'0.5'},g);
  const t = txt('', {x:OX+c*OCELL+OCELL/2, y:OY+r*OCELL+OCELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-primary)'},g);
  outRects.push({rect, idx:r*2+c, r, c});
  outTexts.push(t);
}

// compute all outputs
function compute(i,j) {
  let s=0;
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) s += image[i+r][j+c]*kernel[r][c];
  return s;
}
const results = positions.map(p=>compute(p.i,p.j));

function render(pos) {
  const {i,j} = positions[pos];

  // move kernel window on image
  document.getElementById('kwin').setAttribute('x', IX+j*CELL);
  document.getElementById('kwin').setAttribute('y', IY+i*CELL);

  // highlight image cells in patch
  const cells = imgCells.querySelectorAll('g');
  cells.forEach(g=>{
    const r=+g.dataset.r, c=+g.dataset.c;
    const inPatch = r>=i&&r<i+3&&c>=j&&c<j+3;
    g.querySelector('rect').setAttribute('fill',
      inPatch?'var(--color-background-info)':'var(--color-background-secondary)');
    g.querySelector('rect').setAttribute('stroke',
      inPatch?'var(--color-border-info)':'var(--color-border-tertiary)');
    g.querySelector('rect').setAttribute('opacity', inPatch?'0.45':'1');
    g.querySelector('text').setAttribute('fill',
      inPatch?'var(--color-text-info)':'var(--color-text-primary)');
  });

  // position label
  document.getElementById('pos-label').textContent = `Position (i=${i}, j=${j})  →  image[${i}:${i+3}, ${j}:${j+3}]`;

  // computation text
  const terms = [];
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const iv = image[i+r][j+c], kv = kernel[r][c];
    if (kv!==0) terms.push(`${iv}×(${kv})`);
  }
  document.getElementById('comp-text').textContent = terms.slice(0,6).join(' + ') + (terms.length>6?' + …':'');
  document.getElementById('comp-result').textContent = `= ${results[pos]}`;

  // output cells
  for (let p=0;p<=pos;p++) {
    const {r,c} = outRects[p];
    outRects[p].rect.setAttribute('fill',
      p===pos?'var(--color-background-success)':'var(--color-background-secondary)');
    outRects[p].rect.setAttribute('stroke',
      p===pos?'var(--color-border-success)':'var(--color-border-tertiary)');
    outTexts[p].textContent = results[p];
    outTexts[p].setAttribute('fill',
      p===pos?'var(--color-text-success)':'var(--color-text-secondary)');
  }
  for (let p=pos+1;p<4;p++) {
    outRects[p].rect.setAttribute('fill','var(--color-background-secondary)');
    outRects[p].rect.setAttribute('stroke','var(--color-border-tertiary)');
    outTexts[p].textContent='?';
    outTexts[p].setAttribute('fill','var(--color-text-tertiary)');
  }

  document.getElementById('step-lbl').textContent = pos+1;
}

function step(d) {
  cur = (cur+d+4)%4;
  render(cur);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ pause' : '▶ play';
  if (playing) { tick(); } else { clearTimeout(timer); }
}

function tick() {
  if (!playing) return;
  cur = (cur+1)%4;
  render(cur);
  timer = setTimeout(tick, 1600);
}

render(0);
</script>
