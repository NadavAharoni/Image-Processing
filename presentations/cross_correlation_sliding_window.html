
<style>
  :root {
    --border-radius-md: 6px;
    --color-background-primary:   #ffffff;
    --color-background-secondary: #f4f4f4;
    --color-background-info:      #dbeafe;
    --color-background-success:   #dcfce7;
    --color-background-active:    #fed7aa;
    --color-text-primary:         #111111;
    --color-text-secondary:       #555555;
    --color-text-tertiary:        #999999;
    --color-text-info:            #1d4ed8;
    --color-text-success:         #15803d;
    --color-text-active:          #c2410c;
    --color-border-secondary:     #d1d5db;
    --color-border-tertiary:      #e5e7eb;
    --color-border-info:          #3b82f6;
    --color-border-success:       #22c55e;
    --color-border-active:        #f97316;
  }
  .ts { font-size:13px; font-family:system-ui,sans-serif; }
  .th { font-size:22px; font-family:system-ui,sans-serif; }
  .btn { cursor:pointer; padding:6px 16px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-primary); font-size:13px; }
  .btn:hover { background:var(--color-background-secondary); }
  .btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
</style>

<svg id="svg" width="100%" viewBox="0 0 680 325" role="img">
  <title>Cross-correlation sliding window animation</title>
  <desc>A 4x4 image with a 3x3 kernel sliding across it, showing each position and the resulting 2x2 output</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text class="ts" x="148" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Image (4×4)</text>
  <text class="ts" x="370" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Kernel (3×3)</text>
  <text class="ts" x="560" y="30" text-anchor="middle" fill="var(--color-text-secondary)">Output (2×2)</text>

  <!-- IMAGE GRID 4x4 at x=60, y=44, cell=44px -->
  <g id="image-grid">
    <g id="img-cells"></g>
    <rect id="kwin" x="60" y="44" width="132" height="132" rx="4"
          fill="none" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- KERNEL GRID 3x3 at x=280, y=44, cell=44px -->
  <g id="kernel-grid"></g>

  <!-- multiply sign -->
  <text class="th" x="252" y="118" text-anchor="middle" fill="var(--color-text-secondary)">×</text>

  <!-- Arrow to output -->
  <line x1="458" y1="132" x2="506" y2="132" stroke="var(--color-border-secondary)" marker-end="url(#arrow)"/>

  <!-- OUTPUT GRID 2x2 at x=510, y=88, cell=44px -->
  <g id="output-grid"></g>

  <!-- equation explanation (header) -->
  <text style="font-size:16px;font-family:system-ui,sans-serif;" x="340" y="258" text-anchor="middle" fill="var(--color-text-tertiary)">result[i,j] = Σ (patch × kernel)</text>

  <!-- position indicator (always visible) -->
  <text id="pos-label" class="ts" x="340" y="286" text-anchor="middle" fill="var(--color-text-secondary)"></text>
  <!-- pixel indicator (visible only in pixel mode) -->
  <text id="pix-label" class="ts" x="340" y="304" text-anchor="middle" fill="var(--color-text-active)"></text>
</svg>

<div style="text-align:center;font-size:13px;font-family:system-ui,sans-serif;margin:6px 0 2px;min-height:2.4em;">
  <span id="comp-line"></span>
  <span id="comp-result" style="color:var(--color-text-info);margin-left:4px;"></span>
</div>

<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 4px;flex-wrap:wrap;">
  <button class="btn" onclick="stepPos(-1)">← position</button>
  <button class="btn" onclick="stepPos(1)">position →</button>
  <span style="width:1px;height:20px;background:var(--color-border-secondary);margin:0 4px;"></span>
  <button class="btn" onclick="stepPix(-1)">← pixel</button>
  <button class="btn" onclick="stepPix(1)">pixel →</button>
  <span style="font-size:13px;color:var(--color-text-secondary);margin-left:8px;">
    Position <span id="pos-lbl">1</span>/4<span id="pix-lbl"></span>
  </span>
</div>

<script>
const image = [
  [103,102,101,100],
  [104,103,102,101],
  [ 53, 52, 51, 50],
  [ 45, 53, 52, 51]
];
const kernel = [
  [-1, 2, 1],
  [-2, 1,-3],
  [ 3, 0,-1]
];

const positions = [{i:0,j:0},{i:0,j:1},{i:1,j:0},{i:1,j:1}];
let curPos = 0, curPix = -1;

const CELL = 44, OCELL = 44;
const IX=60, IY=44, KX=280, KY=44, OX=510, OY=88;

const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(content, attrs, parent) {
  const e = el('text', attrs, parent);
  e.textContent = content;
  return e;
}

// build image grid
const imgCells = document.getElementById('img-cells');
for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
  const g = el('g',{},imgCells);
  el('rect',{x:IX+c*CELL, y:IY+r*CELL, width:CELL, height:CELL, rx:2,
    fill:'var(--color-background-secondary)', stroke:'var(--color-border-tertiary)', 'stroke-width':'0.5'},g);
  txt(image[r][c], {x:IX+c*CELL+CELL/2, y:IY+r*CELL+CELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-primary)'},g);
  g.dataset.r = r; g.dataset.c = c;
}

// build kernel grid — keep element refs for per-cell highlighting
const kgCells = [];
const kg = document.getElementById('kernel-grid');
for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
  const g = el('g',{},kg);
  el('rect',{x:KX+c*CELL, y:KY+r*CELL, width:CELL, height:CELL, rx:2,
    fill:'var(--color-background-info)', stroke:'var(--color-border-info)', 'stroke-width':'0.5', opacity:'0.35'},g);
  txt(kernel[r][c], {x:KX+c*CELL+CELL/2, y:KY+r*CELL+CELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-info)'},g);
  kgCells.push(g);
}

// build output grid
const og = document.getElementById('output-grid');
const outRects = [], outTexts = [];
for (let r=0;r<2;r++) for (let c=0;c<2;c++) {
  const g = el('g',{},og);
  const rect = el('rect',{x:OX+c*OCELL, y:OY+r*OCELL, width:OCELL, height:OCELL, rx:4,
    fill:'var(--color-background-secondary)', stroke:'var(--color-border-tertiary)', 'stroke-width':'0.5'},g);
  const t = txt('', {x:OX+c*OCELL+OCELL/2, y:OY+r*OCELL+OCELL/2,
    'text-anchor':'middle', 'dominant-baseline':'central',
    class:'ts', fill:'var(--color-text-primary)'},g);
  outRects.push({rect, r, c});
  outTexts.push(t);
}

// compute all outputs
function compute(i,j) {
  let s=0;
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) s += image[i+r][j+c]*kernel[r][c];
  return s;
}
const results = positions.map(p=>compute(p.i,p.j));

function render(pos, pix) {
  const {i,j} = positions[pos];
  const hasPix = pix >= 0;
  const pr = hasPix ? Math.floor(pix/3) : -1;
  const pc = hasPix ? pix % 3 : -1;

  // move kernel window on image
  document.getElementById('kwin').setAttribute('x', IX+j*CELL);
  document.getElementById('kwin').setAttribute('y', IY+i*CELL);

  // highlight image cells
  imgCells.querySelectorAll('g').forEach(g => {
    const r=+g.dataset.r, c=+g.dataset.c;
    const inPatch = r>=i && r<i+3 && c>=j && c<j+3;
    const isActive = hasPix && r===i+pr && c===j+pc;
    g.querySelector('rect').setAttribute('fill',
      isActive ? 'var(--color-background-active)' :
      inPatch  ? 'var(--color-background-info)' : 'var(--color-background-secondary)');
    g.querySelector('rect').setAttribute('stroke',
      isActive ? 'var(--color-border-active)' :
      inPatch  ? 'var(--color-border-info)' : 'var(--color-border-tertiary)');
    g.querySelector('rect').setAttribute('opacity',
      isActive ? '0.75' : inPatch ? '0.45' : '1');
    g.querySelector('text').setAttribute('fill',
      isActive ? 'var(--color-text-active)' :
      inPatch  ? 'var(--color-text-info)' : 'var(--color-text-primary)');
  });

  // highlight kernel cells
  kgCells.forEach((g, idx) => {
    const kr=Math.floor(idx/3), kc=idx%3;
    const isActive = hasPix && kr===pr && kc===pc;
    g.querySelector('rect').setAttribute('fill',
      isActive ? 'var(--color-background-active)' : 'var(--color-background-info)');
    g.querySelector('rect').setAttribute('stroke',
      isActive ? 'var(--color-border-active)' : 'var(--color-border-info)');
    g.querySelector('rect').setAttribute('opacity',
      isActive ? '0.75' : '0.35');
    g.querySelector('text').setAttribute('fill',
      isActive ? 'var(--color-text-active)' : 'var(--color-text-info)');
  });

  // position label (always shown)
  document.getElementById('pos-label').textContent =
    `Kernel position (${i}, ${j})  →  image patch [${i}:${i+3}, ${j}:${j+3}]`;

  // pixel label (only in pixel mode)
  if (hasPix) {
    const iv = image[i+pr][j+pc], kv = kernel[pr][pc];
    document.getElementById('pix-label').textContent =
      `pixel (${pr}, ${pc}):  image[${i+pr}][${j+pc}] × kernel[${pr}][${pc}]  =  ${iv} × (${kv})  =  ${iv*kv}`;
  } else {
    document.getElementById('pix-label').textContent = '';
  }

  // computation line — individual spans so active term can be highlighted
  const compLine = document.getElementById('comp-line');
  compLine.innerHTML = '';
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const idx = r*3+c;
    const iv = image[i+r][j+c], kv = kernel[r][c];
    if (idx > 0) {
      const sep = document.createElement('span');
      sep.textContent = ' + ';
      sep.style.color = 'var(--color-text-tertiary)';
      compLine.appendChild(sep);
    }
    const span = document.createElement('span');
    span.textContent = `${iv}×(${kv})`;
    if (hasPix && idx === pix) {
      span.style.color = 'var(--color-text-active)';
      span.style.fontWeight = 'bold';
    } else {
      span.style.color = hasPix ? 'var(--color-text-tertiary)' : 'var(--color-text-secondary)';
    }
    compLine.appendChild(span);
  }
  document.getElementById('comp-result').textContent = `= ${results[pos]}`;

  // output cells
  for (let p=0;p<=pos;p++) {
    outRects[p].rect.setAttribute('fill',
      p===pos ? 'var(--color-background-success)' : 'var(--color-background-secondary)');
    outRects[p].rect.setAttribute('stroke',
      p===pos ? 'var(--color-border-success)' : 'var(--color-border-tertiary)');
    outTexts[p].textContent = results[p];
    outTexts[p].setAttribute('fill',
      p===pos ? 'var(--color-text-success)' : 'var(--color-text-secondary)');
  }
  for (let p=pos+1;p<4;p++) {
    outRects[p].rect.setAttribute('fill','var(--color-background-secondary)');
    outRects[p].rect.setAttribute('stroke','var(--color-border-tertiary)');
    outTexts[p].textContent='?';
    outTexts[p].setAttribute('fill','var(--color-text-tertiary)');
  }

  // step label
  document.getElementById('pos-lbl').textContent = pos+1;
  document.getElementById('pix-lbl').textContent = hasPix ? `  ·  pixel ${pix+1}/9` : '';
}

function stepPos(d) {
  curPos = (curPos + d + 4) % 4;
  curPix = -1;
  render(curPos, curPix);
}

function stepPix(d) {
  if (d > 0) {
    curPix = curPix >= 8 ? -1 : curPix + 1;
  } else {
    curPix = curPix <= -1 ? 8 : curPix - 1;
  }
  render(curPos, curPix);
}

render(curPos, curPix);
</script>
